# Bare Sandbox CR using the urunc RuntimeClass.
# Useful when you want to deploy a single, hand-crafted sandbox pod.
#
# ${IMAGE} must be a urunc-bootable image (see bunnyfile). A stock OCI image
# will not boot under urunc.
#
# Replace ${IMAGE} with the location of the repackaged image
# (for example via: envsubst < sandbox-urunc.yaml | kubectl apply -f -).
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: urunc-example
spec:
  podTemplate:
    metadata:
      labels:
        sandbox: urunc
    spec:
      runtimeClassName: urunc
      containers:
      - name: python-runtime
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
          name: http
